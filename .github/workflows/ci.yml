name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore src/KnightShift.Domain
          dotnet restore src/KnightShift.Engine
          dotnet restore src/KnightShift.Application
          dotnet restore src/KnightShift.Infrastructure
          dotnet restore src/KnightShift.Cli

      - name: Build
        run: |
          dotnet build src/KnightShift.Domain --no-restore --configuration Release
          dotnet build src/KnightShift.Engine --no-restore --configuration Release
          dotnet build src/KnightShift.Application --no-restore --configuration Release
          dotnet build src/KnightShift.Infrastructure --no-restore --configuration Release
          dotnet build src/KnightShift.Cli --no-restore --configuration Release

      - name: Run tests
        run: |
          dotnet test tests/KnightShift.Domain.Tests --configuration Release
          dotnet test tests/KnightShift.Engine.Tests --configuration Release
          dotnet test tests/KnightShift.Application.Tests --configuration Release
          dotnet test tests/KnightShift.Infrastructure.Tests --configuration Release
          dotnet test tests/KnightShift.Cli.Tests --configuration Release